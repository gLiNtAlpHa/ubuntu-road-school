*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:18px/1.55 var(--body);-webkit-text-size-adjust:100%}

p{margin:0}

.w{background:none;border:0;border-bottom:2px dotted var(--blue);padding:0;font:inherit;color:inherit}

.sg{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:128px;justify-content:center;min-width:0}

.tl{display:flex;gap:16px;align-items:center}

.qz{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px}

.qz .n{font:700 13px var(--mono);color:var(--soft)}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;background:var(--bg);border:1.5px solid var(--line);border-radius:7px;line-height:1.3}
.opt.ok{background:var(--goodbg);border-color:var(--good)}.opt.no{background:var(--badbg);border-color:var(--bad)}.opt.sel{border-color:var(--blue);border-width:3px;padding:9.5px 11.5px}

.main{display:block;width:100%;background:var(--yellow);color:var(--on-yellow);border:0;border-radius:8px;padding:14px;font:800 20px var(--display)}
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:11px;font-weight:700}
.sheet{position:fixed;inset:auto 0 0;background:var(--card);border-top:4px solid var(--yellow);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;box-shadow:0 -6px 22px rgba(0,0,0,.28)}
.sheet div{max-width:680px;margin:0 auto}
.sheet h3{font-size:22px}
.sheet button{float:right;background:none;border:0;font-size:26px;line-height:1;padding:0 4px}
.hz{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.hz svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hzbtn{padding:12px}
.flags{position:absolute;top:8px;right:8px;background:#000;color:#fff;font:700 14px var(--mono);padding:3px 8px;border-radius:4px}
@keyframes dash{to{stroke-dashoffset:-54}}
.rd{animation:dash 1.8s linear infinite}
.rd.off{animation-play-state:paused}

.hdrive{animation:hdrive 9s linear infinite}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);font:700 13px var(--mono);padding:0}
.grid .on{background:var(--tipbg)}.grid .cur{border-color:var(--blue);border-width:3px}.grid .fl{background:var(--trapbg)}
.mockbar{display:flex;justify-content:space-between;align-items:center;font:700 16px var(--mono)}
.fine{font-size:15px;color:var(--soft);line-height:1.45}
.fine a{color:inherit}
@media (prefers-reduced-motion:reduce){.act,.dbar i,.prog i{transition:none}.rd,.hdrive,.dbody,.exp{animation:none}}
</style>

quiz:[Q(["How deep should adult chest compressions be?","How deep adult chest compression go be?"],["5 to 6 cm","1 to 2 cm","3 to 4 cm","8 to 10 cm"],0,["Hard and deep, about twice a second.","Hard and deep, like two times every second."]),Q(["Who can use a public defibrillator?","Who fit use public defibrillator?"],[["Anyone","Anybody"],["Only paramedics","Only paramedic"],["Only trained first aiders","Only trained people"],["Only police","Only police"]],0,["It gives spoken instructions.","E dey talk wetin to do."]),Q(["How long should you cool a burn?","How long you go cool burn?"],[["At least 10 minutes","At least 10 minutes"],["30 seconds","30 seconds"],["2 minutes","2 minutes"],["Do not cool it","No cool am"]],0,["Clean, cold water or other non-toxic liquid.","Clean cold water or liquid wey no get poison."]),Q(["A motorcyclist is hurt. Should you remove the helmet?","Okada rider wound. You go comot helmet?"],[["Not unless essential","No, unless e necessary"],["Yes, always","Yes, always"],["Yes, to give air","Yes, make e get air"],["Yes, to give water","Yes, to give water"]],0,["Moving the head can make injuries worse.","To move head fit make wound worse."]),Q(["How far behind should you place a warning triangle on an ordinary road?","How far for back to put warning triangle for normal road?"],[["At least 45 metres","At least 45 metres"],["5 metres","5 metres"],["10 metres","10 metres"],["100 metres","100 metres"]],0,["Never on a motorway.","Never for motorway."]),Q(["What should you give an injured person to drink?","Wetin you go give wounded person drink?"],[["Nothing","Nothing"],["Water","Water"],["Tea","Tea"],["Alcohol","Alcohol"]],0,["They may need surgery.","Dem fit need operation."])]});

["scene",{bg:"road",alt:["A car towing a caravan","Motor dey tow caravan"],a:{c:["tow","#3e78c9"],t:["tag","60 motorway · 60 dual · 50 single","#000"]},s:[[["Towing a caravan makes you longer and heavier, so your limits drop.","If you dey tow caravan, you long and heavy pass, so your limit go down."],{c:[100,95,90],t:[200,36]}],[["Go gentle. Plan earlier. You take longer to stop.","Go soft. Plan early. E go take time to stop."],{c:[240,95,90]}],[["If it starts [[snaking|snaking]], ease off gently. Do not brake hard.","If e begin [[snaking|snake]], leave accelerator small. No brake hard."],{c:[290,95,84]}],[["Stay out of lane 3 on a three-lane motorway.","No enter lane 3 for three-lane motorway."],{c:[380,95,92]}]]}],
["l",[["**The driver** is responsible for the load being safe.","**Driver** responsible for load."],["**Heavy load:** tyre pressures may need raising. Check your handbook.","**Heavy load:** tyre pressure fit need increase. Check handbook."],["**Roof rack:** secure it. It adds drag and uses more fuel, so remove it when empty.","**Roof rack:** tie am well. E dey use more fuel, remove am if e empty."],["**Stabiliser:** helps with towing but does not replace careful driving.","**Stabiliser:** e dey help tow, but careful driving still need."],["**Spread heavy items** low and over the axle, secured.","**Put heavy thing** low and for axle, tie am."],["**Children:** the right seat and restraint for size and age.","**Pikin:** correct seat for size and age."]]],
["trap",["Heavy load questions usually want pressure changes or better securing, not going faster to finish.","Heavy load question dey want tyre pressure or better tie, no be to go fast."]],
["try",["Check a car's handbook for its loaded tyre pressures.","Check handbook of motor for tyre pressure when e load."]]],
quiz:[Q(["Your caravan starts snaking. What should you do?","Caravan begin snake. Wetin you go do?"],[["Ease off the accelerator gently","Leave accelerator soft"],["Brake hard","Brake hard"],["Accelerate hard","Accelerate hard"],["Steer quickly side to side","Turn quick left and right"]],0,["Let speed fall so it calms.","Make speed go down, e go calm."]),Q(["Who is responsible for a safe load?","Who responsible for safe load?"],[["The driver","Driver"],["The passenger","Passenger"],["The owner only","Owner only"],["The manufacturer","Company wey make am"]],0,["The driver answers for the vehicle.","Driver go answer for motor."]),Q(["What is the speed limit for a car towing on a motorway?","Speed limit for car wey dey tow for motorway?"],["60 mph","70 mph","50 mph","40 mph"],0,["60 on motorways and dual carriageways, 50 on single roads.","60 for motorway and dual, 50 for single."]),Q(["Why remove an empty roof rack?","Why remove empty roof rack?"],[["It wastes fuel through extra drag","E dey waste fuel"],["It is illegal","Law no gree"],["It damages tyres","E dey spoil tyre"],["It stops the air conditioning","E stop AC"]],0,["Air drag makes the engine work harder.","Wind dey make engine work hard."])]});

/* ===== The full Highway Code, made simple (English) ===== */
var HC=[
{t:"How the Code works",r:"Intro, H1–H3",lede:"Two kinds of rule, and one big idea: the more harm you can do, the more care you owe.",g:[
["MUST and SHOULD",["**MUST / MUST NOT** = the law. Break it and you can be fined, get points, be banned or go to prison.","**Should / do / do not** = advice. Not a crime by itself, but a court can use it to decide who was at fault.","The Code covers England, Scotland and Wales."]],
["The hierarchy of road users (H1)",["Order of who is most at risk: **pedestrians → cyclists → horse riders → motorcyclists → cars and taxis → vans and minibuses → buses, coaches and lorries.**","The bigger your vehicle, the **bigger your duty** to look out for others.","It does not let anyone off: everyone, walkers too, must think about their own safety and others'.","Some people have poor sight, hearing or mobility that you cannot see. Expect it."]],
["Rule H2: give way to people walking",["At a junction, give way to people **crossing or waiting to cross** the road you are turning into or out of.","On a **zebra** you MUST give way to people on it. On a **parallel crossing** you MUST give way to walkers and cyclists on it.","You **should** give way to people **waiting** at a zebra or parallel crossing.","Cyclists give way to walkers on shared paths. Pavements are for walkers and wheelchair or scooter users only."]],
["Rule H3: do not cut across bikes and horses",["Turning into or out of a junction, or changing lane, **do not cut across** cyclists, horse riders or horse-drawn vehicles going straight on.","This applies whether they are on the road, in a cycle lane or on a cycle track.","Wait for a safe gap, including when they pass queues or are going round a roundabout."]],
["Self-driving cars",["Only cars on the government's self-driving list can drive themselves. Cruise control or lane-keeping is **not** self-driving: you are still the driver.","Even in a self-driving car you must be fit to drive, in the driving seat and awake, ready to take control."]]]},
{t:"People walking",r:"1–35",lede:"Know what walkers are told, so you can predict what they will do.",g:[
["Walking on roads",["Use the pavement. No pavement? Walk on the **right**, facing traffic. Cross before a sharp right bend.","At night wear something **reflective**. It can be seen about **three times** further away.","Groups walking on roads keep left, with look-outs at front and back (white light at front, red at back at night).","Walkers must not be on **motorways or slip roads** except in an emergency."]],
["Crossing",["**Green Cross Code**: find a safe place, stop at the kerb, look and listen all round, let traffic pass, cross straight, do not run.","At junctions, traffic should give way to walkers crossing. If they have started, they have priority.","**Tactile paving**: raised studs at dropped kerbs; rounded bars at level crossings and steps. It helps blind people.","Do not cross between parked cars with engines running, or behind a vehicle that is reversing."]],
["Crossing types (know them all)",["**Zebra**: black and white stripes, flashing amber **beacons**. Zebra with an island = **two** crossings.","**Pelican**: push button, red/green figure across the road, **flashing green** for walkers and **flashing amber** for drivers.","**Puffin**: figure on the walker's side, sensors, **no flashing** stage.","**Toucan**: walkers **and cyclists** cross together.","**Equestrian (Pegasus)**: for horse riders, with higher buttons.","**Staggered** crossing with island = two crossings; press again on the island.","**School crossing patrol**: cross only when signalled, in front of them."]],
["Buses, trams and emergencies",["Never cross in front of or behind a bus. Wait until it moves.","Trams are quiet and cannot steer round you.","Keep off the road when blue lights or sirens come."]]]},
{t:"Wheelchairs and scooters",r:"36–46",lede:"Powered wheelchairs and mobility scooters are slow and low. Expect them on the road.",g:[
["Classes and speeds",["**Class 1**: manual wheelchair. **Class 2**: powered, max **4mph**, for pavements. **Class 3**: max **8mph** on roads, **4mph** on pavements.","On the road they follow road rules; on the pavement, walker rules.","They must never use **motorways**. On an unrestricted dual carriageway (limit over **50mph**) they must have a **flashing amber beacon**.","Drivers: give them time. They may be slower than you think and hard to see."]]]},
{t:"Horses and animals",r:"47–58",lede:"Horses scare easily. Riders are often children.",g:[
["What riders are told",["Under-**14s** must wear a riding helmet (Sikhs in turbans are exempt).","Ride on the left, **no more than two abreast**, single file on narrow or busy roads.","Horses must not be ridden on **pavements or footpaths**.","Riders avoid roundabouts. If they use one they keep **left** and signal **right** across exits they do not want."]],
["What drivers do",["Pass at **10mph or less**, at least **2 metres** away. No horn, no revving.","A herd blocking the road: **stop and switch off** your engine until they pass.","Dogs in cars should be restrained (harness, crate or guard)."]]]},
{t:"Cyclists",r:"59–82",lede:"Know cyclist rules so their moves make sense to you.",g:[
["Cyclists' rules that affect you",["At night bikes MUST have a **white front light, red rear light and red rear reflector**.","Cyclists may ride **two abreast**. It can be safer in groups and on narrow roads.","They may ride in the **centre of the lane** on quiet roads, in slow traffic and near junctions.","On busy roads they keep at least **0.5m** from the kerb. They leave about **1m** (a door's width) from parked cars.","They do not have to use cycle lanes.","They may cross the **first** line of an advanced stop line on red, not the second."]],
["Your duty",["Leave at least **1.5m** when overtaking at up to **30mph**, more at higher speeds.","Do not cut across a cyclist going straight on when you turn (Rule H3).","Watch for bikes passing on your left in slow traffic and at junctions.","Expect them to swerve round potholes, drains and wet patches."]]]},
{t:"Motorcyclists",r:"83–88",lede:"Small, fast, easy to miss.",g:[
["Key rules",["Rider and passenger MUST wear helmets (Sikhs in turbans exempt).","Only **one** passenger, on a proper seat. **Learner** motorcyclists may **not** carry passengers.","Riders use dipped headlights and bright or reflective clothing to be seen.","Motorcyclists use **Observation – Signal – Manoeuvre** and may filter through slow traffic. Check mirrors before changing lane."]]]},
{t:"Before you drive",r:"89–102",lede:"You, your eyes, your car and your passengers.",g:[
["Fit to drive",["Tell **DVLA** about any condition that affects driving.","Read a number plate from **20 metres** (20.5m for old plates), with glasses if you need them.","Tired: do not start. Avoid long trips between **midnight and 6am**. Break at least **15 minutes every 2 hours**.","No tinted glasses at night or in poor visibility. Dazzled by sun: slow down or stop."]],
["Alcohol and drugs",["Limits in **England and Wales**: **35 microgrammes per 100ml of breath**, or **80 milligrammes per 100ml of blood**.","**Scotland**: **22** per 100ml of breath, or **50** per 100ml of blood.","Safest amount: **none**. Alcohol stays in your body, so the morning after can be over the limit.","Illegal drugs and some medicines are also illegal over set levels. Check the label."]],
["Seat belts and children",["Everyone wears a belt where fitted. The **driver** is responsible for passengers **under 14**.","Children use a child seat until **12 years old or 135cm** tall, whichever comes first.","**Never** put a rear-facing baby seat where an **active airbag** is in front of it.","Children get out on the **kerb side**. Use child locks."]],
["Towing and loads",["Your licence decides what you can tow. Do not overload. Secure the load and use a breakaway cable or secondary coupling.","Towing lowers your speed limits, increases stopping distance and bans you from the right lane of 3+ lane motorways."]]]},
{t:"Signals, lights and speed",r:"103–126",lede:"How to tell others what you plan, and how fast is too fast.",g:[
["Signals",["Signal clearly and in good time. Cancel it after. Do not signal too early (for example before a side road you are not turning into).","A signal does **not** give you priority. Another driver's signal may have been left on by mistake.","You MUST obey police, traffic officers, DVSA officers, traffic wardens and school crossing patrols.","Police want you to stop: pull over when safe, then **switch off the engine**."]],
["Flashing lights and horn",["Flash headlights **only** to say you are there. Never take a flash as permission to go.","Horn: only to warn others, while moving. **Not** when stationary. **Not** in a built-up area between **11.30pm and 7am**, unless another road user is a danger."]],
["Lights",["Sidelights and rear plate lights MUST be on from **sunset to sunrise**.","Headlights at night, except on lit roads with a **30mph** limit (20mph in Wales).","**Night** = from **half an hour after sunset** to **half an hour before sunrise**.","Use headlights when visibility is seriously reduced, generally **under 100 metres**. Fog lights then too, but off when it clears.","**Hazard lights** when stationary to warn of an obstruction. While moving, only on a **motorway or unrestricted dual carriageway** to warn of a hazard ahead.","In a queue at night, use the parking brake and release the footbrake once traffic behind has stopped, so your brake lights do not dazzle."]],
["Brakes and control",["Brake early and lightly. In an emergency brake hard but do not lock the wheels.","**ABS**: press firmly and keep pressing. It helps steering, it does not always shorten stopping.","**Skid**: ease off the brake or accelerator and steer smoothly in the direction of the skid.","After deep water, **test your brakes**. Dry them by braking gently while driving slowly.","**Coasting** (neutral or clutch down) means less control. Do not do it.","Do not leave a parked car with the engine running. Switch off if stopped for more than a couple of minutes."]],
["Speed and gaps",["Speed limits are a **maximum, not a target**.","**Two-second** gap on fast roads, double on wet roads, up to **ten times** on ice.","In tunnels: two seconds for cars, **four seconds** for large vehicles. Stopped in a tunnel? Leave at least **5 metres**.","Stopping distance has two parts: **thinking** plus **braking**. Dry totals: 20mph **12m**, 30 **23m**, 40 **36m**, 50 **53m**, 60 **73m**, 70 **96m**."]]],w:["limitsfull","stop"]},
{t:"Lines, lanes and roads",r:"127–158",lede:"White lines tell you what you may cross. Lanes tell you where to be.",g:[
["Lines along the road",["**Centre line**: short lines, long gaps. **Hazard warning line**: long lines, short gaps. Cross only when you can see it is clear.","**Double white, broken line your side**: you may cross to overtake if safe and you can finish before a solid line.","**Double white, solid line your side**: MUST NOT cross, except to enter a side road or property, to pass a **stationary** vehicle, or to overtake a **cycle, horse or road maintenance vehicle doing 10mph or less**.","**Diagonal hatching**, broken border: do not enter unless necessary and safe. **Solid border**: MUST NOT enter except in an emergency.","**Studs**: white = lanes/centre, **red** = left edge, **amber** = central reservation, **green** = slip roads and lay-bys, green/yellow = roadworks."]],
["Lanes",["Change lanes with mirrors, a glance sideways, a signal, then move. Do not force anyone to slow.","**Zip merge** in turn at low speed when lanes close.","**Three-lane single carriageway**: the middle lane is only for overtaking or turning right. Never use the right-hand lane.","**Dual carriageway**: stay left, use the right lane to overtake or turn right.","**Crawler lanes** are for slow vehicles going uphill.","**Cycle lane** with a solid white line: MUST NOT drive or park in it during its hours.","**Bus lanes**: do not drive in them during their hours. You may enter to stop, load or unload where that is allowed.","**One-way streets**: left lane to go left, right lane to go right."]],
["How you drive",["MUST NOT drive dangerously, carelessly or without consideration.","MUST NOT drive on pavements, except to get into a property.","MUST NOT **throw anything** out of a vehicle.","MUST NOT smoke, or let anyone smoke, in an enclosed private car with someone **under 18** in it.","**Phones**: MUST NOT hold one while driving or supervising a learner, even when stopped in traffic. Exceptions: **999/112** in an emergency when it is unsafe to stop, or contactless payment while **stationary**. Hands-free still distracts.","Driver aids such as lane assist do **not** reduce your responsibility."]],
["Special roads",["**Residential streets**: slowly. Some are **20mph**.","**Traffic calming** (humps, chicanes): keep a slow speed all the way through. Do not overtake.","**Country roads**: be able to stop in the distance you can see to be clear.","**Single-track roads**: pull into a passing place on your **left**, or wait opposite one on your **right**. Give way to vehicles coming uphill. Never park in passing places.","Mini motos and off-road bikes MUST NOT be used on roads or pavements."]]]},
{t:"Moving off, overtaking, junctions",r:"159–183",lede:"The moments when most crashes happen.",g:[
["Moving off and mirrors",["Mirrors, **blind spot**, signal if needed, final look, go.","Keep left unless overtaking or turning right. Pick a lower gear **before** a long downhill.","**MSM**: Mirror – Signal – Manoeuvre, every time."]],
["Overtaking",["Before: clear ahead, nobody overtaking you, and a gap to return to.","Leave **1.5m** for cyclists (up to 30mph), **2m** for horses (under 10mph), **2m** for people walking in the road.","Large vehicles: drop back to see ahead. Do not follow another car overtaking a long vehicle.","**MUST NOT** overtake: over a solid double white line on your side, the **moving vehicle nearest a pedestrian crossing**, in a bus/tram/cycle lane during its hours, after a **No Overtaking** sign.","**Do not** overtake near junctions, bends, hill brows, hump bridges, level crossings, school patrols, where the road narrows, or a cyclist or horse turning left.","Being overtaken: keep a steady course, slow down if needed. Never speed up.","Slow vehicle with a queue behind? Pull in safely and let them pass."]],
["Junctions",["Watch for walkers, cyclists, motorcyclists and scooters. Give way to walkers crossing (H2).","**STOP sign** with solid line: you MUST stop at the line, even if the road looks clear.","**Give Way** with broken lines: you MUST give way to main road traffic.","**Dual carriageway**: if the central gap is deep enough for your whole vehicle, cross one half at a time. Too shallow? Cross both in one go.","**Box junction**: MUST NOT enter unless your exit is clear. Exception: turning right and blocked only by oncoming or other right-turning traffic."]],
["Traffic lights",["MUST stop behind the line on red. On **amber**, go only if already over the line or too close to stop safely.","Green: go only if there is room to clear the junction.","Lights not working: treat it as an **unmarked junction**. Great care.","**Green filter arrow**: only for traffic going that way.","**Advanced stop line**: stop at the first line on amber or red. If the light turned red after you crossed the first line, you MUST stop at the **second** line."]],
["Turning",["Turning right: mirrors, signal, position **just left of the middle** of the road. Wait for a gap. Do not cut the corner.","Two cars turning right opposite each other: **offside to offside** (pass behind each other) is usually safer.","Turning left: keep left, do not overtake just before. Give way to traffic in bus and cycle lanes and on tram tracks."]]]},
{t:"Roundabouts, crossings, reversing",r:"184–203",lede:"Who goes first, and how to show where you are going.",g:[
["Roundabouts",["Give priority to traffic from the **right**, unless signs or markings say otherwise.","**First exit (left)**: signal **left**, left lane, keep signalling left.","**Right or full circle**: signal **right**, right lane, keep signalling right, then signal **left** after the exit **before** yours.","**Middle exits**: usually no signal on approach. Signal **left** after passing the exit before yours.","Give room to cyclists, motorcyclists, walkers crossing the exits, and long vehicles (they may take two lanes)."]],
["Mini-roundabouts",["Same rules but less space and time. All vehicles MUST pass **round** the central marking, except large vehicles that physically cannot.","Avoid U-turns. **Double** mini-roundabouts: treat each one separately."]],
["Crossings",["MUST NOT park on a crossing or its **zig-zag** lines. MUST NOT overtake the vehicle nearest the crossing.","In a queue keep the crossing clear. Never edge forward or rev to hurry walkers.","**Zebra**: MUST give way once someone is on it. Do not wave people across.","**Pelican**: red = stop. **Flashing amber** = give way to anyone on the crossing, go if clear.","Pelican going **straight across** with an island = **one** crossing: wait for people from the far side.","**Puffin, toucan, equestrian**: **no flashing amber**. Same sequence as traffic lights."]],
["Reversing and turning round",["Turn round in a quiet side road, not a busy one.","**Never reverse from a side road into a main road.** Reverse into a driveway, drive out.","Before reversing check all round, especially for children. Look mainly through the rear window.","MUST NOT reverse further than necessary."]]],w:["lights"]},
{t:"People who need extra care",r:"204–225",lede:"Slow down where people are most likely to get hurt.",g:[
["Who and where",["Most at risk: pedestrians, cyclists, motorcyclists, horse riders, especially **children, older people and disabled people**.","Hit at **40mph**, a pedestrian will probably be killed. At **20mph** there is about a **1 in 20** chance of death.","Slow down near shops, schools, bus stops, ice-cream vans, parked cars and **Home Zones / Quiet Lanes**.","**School bus** stopped: children may be getting on or off. School crossing patrol shows **Stop for children**: you MUST stop."]],
["Bikes and animals",["Look for motorcyclists and cyclists before turning or changing lane. A look over the shoulder means they may move out.","Animals: pass slowly and wide. Herd in the road: stop and switch off."]],
["Other drivers",["Older drivers may react slowly. Be patient with learners and new drivers (some show **green P plates**).","**Emergency vehicles**: let them pass, but do not mount kerbs, brake hard near junctions or stop on bends or hill brows."]],
["Big and special vehicles",["Long vehicles need extra room to turn. If you cannot see their mirrors they cannot see you.","Many lorries are limited to **56mph**, even on motorways.","Give buses priority when they signal to pull away from a stop, if safe.","**Electric vehicles** (milk floats, trams) are quiet.","**Flashing amber beacon** = slow vehicle or abnormal load. Vehicles with a top speed of **25mph** or less must show one on unrestricted dual carriageways."]]]},
{t:"Bad weather",r:"226–237",lede:"Everything gentle, everything earlier.",g:[
["Visibility",["Headlights when visibility is under **100 metres**. Fog lights allowed then, **off** when it improves (they dazzle and hide brake lights)."]],
["Wet",["Stopping distances at least **double**. Steering goes light? Ease off.","Spilt **diesel** makes roads very slippery, especially for motorcyclists."]],
["Ice and snow",["Only go if essential. Clear **all** windows, lights, number plates, mirrors and snow on the roof.","Stopping can be up to **ten times** longer. Drive slowly in the **highest gear** you can.","Steering feels light and tyres go **quiet** on ice.","Do not overtake gritters or snowploughs unless the lane is clear."]],
["Wind, fog and heat",["Wind affects **high-sided vehicles**, cyclists, motorcyclists and horses most, on bridges and open roads.","In fog: slow down, use lights, be able to stop within the distance you can see. Do not speed up to escape a tailgater.","Hot weather: roads can soften. First rain after dry weather is slippery."]]]},
{t:"Waiting and parking",r:"238–252",lede:"Where you may stop, where you must not, and how to leave the car.",g:[
["Lines",["**Double yellow**: no waiting at any time. **Single yellow**: no waiting at the times on the sign.","**Double red** (red route): no stopping at any time. Single red: no stopping at the times shown.","**Yellow marks on the kerb**: loading rules. Double = no loading at any time."]],
["Never stop or park on",["Motorways, the hard shoulder or an emergency area (except in an emergency).","Pedestrian crossings and their **zig-zags**. Clearways. Taxi bays.","Double white lines, except briefly to pick up or set down passengers or to load or unload.","Bus, tram or cycle lanes during their hours. Cycle tracks."]],
["Do not stop or park",["Within **10 metres** of a junction (unless in a marked bay).","Near a school entrance, bus stop or taxi rank. On the approach to a **level crossing**.","Near the brow of a hill or a hump bridge. On a bend. Opposite a traffic island.","Where the kerb is lowered for wheelchairs, or in front of an entrance.","On the **pavement** in **London** or **Scotland**. Elsewhere only where signs allow."]],
["Parking well",["Close to the kerb, facing the same way as traffic. Engine, headlights and fog lights off. Handbrake on.","Open doors with the **far hand** (Dutch Reach). Look for cyclists.","At **night**, never park facing against the traffic unless in a parking space.","On a road with a limit **over 30mph**: show **parking lights**.","At **30mph or less**, cars may park without lights if at least **10m** from a junction, close to the kerb, facing the way of traffic.","**Hill**: uphill = **first gear**, wheels **away** from the kerb. Downhill = **reverse**, wheels **towards** the kerb. Automatic: Park.","Lorries over **7.5 tonnes** must not park on verges or pavements without police permission."]]]},
{t:"Motorways",r:"253–274",lede:"Fast, strict and simple.",g:[
["Who must not use them",["Walkers, cyclists, horse riders, **learner motorcyclists**, motorbikes under **50cc**, mobility scooters, farm vehicles.","**Learner car drivers** only with an approved instructor in a **dual-control** car with L plates."]],
["Joining and driving",["Join from the slip road. Give priority to motorway traffic, match its speed, fit into lane 1. Do not cross solid white lines.","Keep **left** unless overtaking. Overtake on the **right** only.","Do not move left to pass. In queues where all lanes move at similar speed, keeping up in your lane is fine. Do not weave.","On 3+ lanes, these MUST NOT use the **right-hand lane**: vehicles **towing**, goods vehicles over **7.5 tonnes**, and some buses and speed-limited vans.","Move out of the left lane, if safe, to pass emergency services, traffic officers or recovery workers on the hard shoulder."]],
["Signals",["**Amber flashing lights**: hazard ahead. Slow down until you pass a clear sign or the end of the hazard.","A **speed in a red circle** above lanes is a legal limit (variable speed).","**Red X** or **red flashing lights** over your lane: lane closed. You MUST NOT drive in it.","Red lights over all lanes: the road is closed. Do not pass the sign or use the hard shoulder unless told to by police.","**Hard shoulder**: only in an emergency, unless a **speed limit is shown above it**. Red X or blank = emergencies only.","**Emergency areas**: blue signs with an orange **SOS** phone symbol, often an orange surface."]],
["Never on a motorway",["**Reverse** (even on the hard shoulder or slip road), cross the central reservation, drive the wrong way. Missed your exit? Go to the **next** one.","Stop on the carriageway, hard shoulder or slip road, except in an emergency or when told to.","Pick up or set down anyone, or walk on it, except in an emergency."]],
["Leaving",["Countdown markers before an exit: **300, 200, 100 yards** (each bar 100 yards).","Get into the left lane early, signal left early, slow down on the slip road. **50mph may feel like 30** after fast driving: check your speedometer."]]],w:["moto"]},
{t:"Breakdowns and incidents",r:"275–287",lede:"Get safe, get seen, get help.",g:[
["Breaking down",["Get off the road if you can. Hazard lights on. Light clothing by day, reflective at night.","**Warning triangle** at least **45 metres** behind on the same side, but **never on a motorway**.","**Motorway**: leave at the next exit or services. Cannot? Go left, wheels turned left, get out by the **left** door, behind the barrier. Call 999 if you cannot get to safety or are in a live lane.","Cannot get out safely? Stay in, **belt on**, hazards on, call **999**.","Disabled drivers who cannot leave the car: stay in, belt on, hazards on, call 999.","Something falls from your vehicle on a motorway: **do not** try to get it. Stop in a safe place and call 999."]],
["At a crash",["Flashing lights ahead: slow down. Do not slow down just to look at a crash.","Stop safely, hazards on, switch off engines, **no smoking**, call 999 or 112.","Move uninjured people away. Do not move injured people unless they are in danger.","Do not remove a motorcyclist's helmet unless it is essential."]],
["Dangerous goods",["**Plain orange reflective plates** = packaged dangerous goods. Tankers carry **hazard warning plates** showing what they carry.","At an incident: switch off engines, no smoking, keep well away, tell 999 the plate details. No phones near flammable loads."]],
["The law after a collision",["If there is damage or injury you MUST **stop**.","Give your **name, address and registration** to anyone with good reason to ask.","Did not give details at the scene? **Report to the police within 24 hours**.","Someone injured and you cannot show insurance? Report within **24 hours** and show the insurance certificate within **7 days**."]]]},
{t:"Road works, rail and trams",r:"288–307",lede:"Temporary rules, trains that cannot stop, trams that cannot steer.",g:[
["Road works",["Obey temporary speed limits and signs. Merge in turn. Keep out of coned-off areas.","High-speed roads: watch for slow works vehicles with flashing arrows.","**Contraflow**: narrower lanes, no barrier from oncoming traffic, you may use the hard shoulder."]],
["Level crossings",["Never drive onto one until the road beyond is clear. Never stop or park on or near one.","**Amber then flashing red**: MUST stop. **If a train passes and the lights keep flashing, another train is coming.**","Never zig-zag round half barriers. Never reverse onto a crossing.","Overhead electric lines: usual safe height **5 metres**.","**User-operated gates**: use the phone if there is one. Open both gates, check it is clear, cross quickly, close both gates, phone again to say you are clear.","**Open crossing** (no gates, no lights, Give Way sign): look both ways, listen.","**Breakdown on the crossing**: get **everyone out** and clear. Use the railway phone. Move the car only if there is time. If the **alarm sounds or the amber light comes on**, get clear at once."]],
["Trams",["Do not drive in tram-only areas or along the rails. Diamond signs and white lights are for **tram drivers** only.","Always give way to trams. Do not race them or pass on the inside unless allowed.","At tram stops without a platform, do not pass between the tram and the kerb.","Cross tram rails at a **right angle** if possible, especially when wet.","Tram wires are normally **5.8m** high."]]]},
{t:"Signals from lights and people",r:"Signals",lede:"Lights, officers and arm signals you must understand.",g:[
["Traffic lights",["Order: **red → red and amber → green → amber → red**.","**Red and amber**: still stop. **Amber alone**: stop, unless it is unsafe to.","**Green arrow** (filter): you may go that way even if the main light is red."]],
["Flashing red lights",["Alternate flashing red lights at **level crossings, swing bridges, airfields, fire stations and lifting bridges**: you MUST stop."]],
["Motorway lane signals",["**Red X**: do not use this lane. **White diagonal arrow**: move to the lane shown.","**Amber flashing** plus a speed: temporary maximum speed. **End** or national limit sign: restriction over."]],
["Your signals",["Indicators: right = moving out or turning right. Left = moving in, turning left, or stopping on the left.","Arm signals: **right arm straight out** = turning right. **Right arm circling anticlockwise** = turning left. **Right arm moving up and down** = slowing or stopping.","Brake lights only mean braking. Reversing lights only mean reversing."]],
["Officers",["You MUST obey police, traffic officers and DVSA examiners. Traffic officers and DVSA use **flashing amber** lights.","A police signal **overrides** traffic lights.","School crossing patrol: when the sign is raised, all vehicles MUST stop."]]],w:["lights"]},
{t:"Traffic signs (Know Your Traffic Signs)",r:"Signs",lede:"Shape tells the job. Colour tells the road.",g:[
["Shape",["**Circles** give orders. **Red ring** = you must not. **Blue circle** = you must (or a route only for certain traffic).","**Triangles** warn. All warning triangles have a red border.","**Rectangles** inform.","**Exceptions** so you know them even when dirty or covered: **STOP** is an **octagon**; **Give Way** is an **upside-down triangle**."]],
["Colour of direction signs",["**Blue**: motorways (junction numbers in white on a **black** box).","**Green** with yellow numbers: **primary** (main A) roads.","**White** with black border: non-primary and local roads.","**Brown**: tourist places. **Yellow** with black symbols (square, triangle, diamond, circle): **diversion** routes.","Small blue patch on a green sign = leads to a motorway. Route number in **brackets**, like **(M6)**, means you reach that road by following this one.","**Blue rectangles** elsewhere are information signs (like one-way, parking, hospital)."]],
["Orders worth knowing",["White circle with **black diagonal**: **national speed limit** applies (60 single, 70 dual, for cars).","**No entry**: red circle with white bar. **No waiting**: blue circle, red ring, one red diagonal. **No stopping (clearway)**: two red diagonals.","**Minimum speed** = blue circle with a number. A red line through it ends it.","**Priority over oncoming traffic**: blue square, big white arrow up, small red arrow down. The opposite sign (red ring) means you give way to oncoming traffic.","Signs showing **height, width or weight** limits: in a red ring.","A **plate** under a sign changes its meaning, e.g. times or 'except buses'."]],
["Warnings worth knowing",["Steep hill **20%** = **1 in 5**.","Level crossing **with** barrier: picture of a gate. **Without** barrier: picture of a steam train.","Countdown markers to a **concealed level crossing** have **red** bars.","School, children, elderly or disabled people, cattle, wild animals, horses, ice, side winds, tunnel, falling rocks, hump bridge, road works, quayside, low-flying aircraft."]],
["Road works signs",["Temporary signs often have a **yellow** background. **End of road works** ends the temporary limits.","Back-of-vehicle signs at **800 and 450 yards** warn of a works vehicle blocking a lane."]]],w:["signs"]},
{t:"Road and vehicle markings",r:"Markings",lede:"Paint on the road and plates on vehicles.",g:[
["Across the road",["Solid white line: **stop line** (at lights or STOP sign).","Double broken white line: **give way** line.","Single broken line at a roundabout: give way to traffic from the right."]],
["Other markings",["**SCHOOL KEEP CLEAR**: do not stop, even to drop off or pick up children.","**Yellow criss-cross box**: box junction.","**KEEP CLEAR**: do not block that part of the road.","**Zig-zag lines** at crossings: no parking or overtaking.","Red route **loading-only** box: loading only, up to **20 minutes** at the times shown."]],
["Vehicle markings",["Red and yellow rear stripes on goods vehicles over **7,500kg**, trailers over **3,500kg**, and skips.","**Projection markers** when a load sticks out more than **2 metres** front or back.","**Orange** hazard plates on tankers and dangerous goods. **School bus** sign in the window."]]]},
{t:"Papers, penalties, maintenance",r:"Annexes 3–8",lede:"Laws on paperwork, points and keeping your car safe.",g:[
["Documents (Annex 3)",["**MOT** at **3 years** old, then every year. Cars over **40 years** old (not changed much) are exempt.","**Vehicle tax** on any car kept or used on a road, unless it is declared **SORN** (off the road).","**Insurance**: third party (legal minimum), third party fire and theft, comprehensive.","**Learner supervisor**: at least **21**, and has held a full licence for that type of car for **3 years**. Red **L plates** (D plates in Wales).","Police can ask for licence, insurance and MOT. If you do not have them, take them to a police station within **7 days**.","A non-UK licence (from outside the EC) can be used for **12 months** after you become resident."]],
["Penalties (Annex 5)",["**12 points within 3 years** = ban of at least **6 months**.","**New drivers**: **6 points within 2 years** of passing = licence revoked. Back to provisional, retake theory and practical.","Phone: **6 points**. Speeding: usually **3 points** (fixed penalty). No insurance: **6–8**. Failing to stop or report: **5–10**.","Drink-driving: at least **12 months** ban. Second within **10 years**: at least **3 years**.","Dangerous driving: up to **2 years** prison. Causing death by dangerous driving: up to **life**."]],
["Maintenance (Annex 6)",["Tyres: car minimum tread **1.6mm** across the central three-quarters, all the way round. Motorcycles and large vehicles **1mm**.","Check tyre pressures **weekly**, when **cold**. Check fluids at least weekly.","Engine overheated: let it cool before opening the coolant cap.","**Engine fire**: do not open the bonnet. Get out and call the fire service.","No smoking or phone use on a petrol forecourt. Lock the car even for a few minutes."]],
["First aid (Annex 7)",["**DR ABC**: Danger, Response, Airway, Breathing (check up to **10 seconds**), Compressions.","Adult CPR: two hands in the centre of the chest, **5–6cm** deep, about **twice a second** (100–120 a minute). Child: one hand, less deep. Baby: two fingers.","Send someone for a **defibrillator (AED)**. Anyone can use one.","Breathing but unconscious: **recovery position**.","Bleeding: firm pressure, but not on anything stuck in the wound. Raise an unbroken limb.","Burns: cool with cold water for at least **10 minutes**. Do not remove anything stuck to the burn.","Shock: keep warm, reassure, **nothing to eat or drink**."]],
["New drivers (Annex 8)",["About **1 in 5** new drivers crash in their first year.","Riskiest time: **midnight to 6am**. Passengers can distract you or pressure you.","**Pass Plus** training can build skill and may cut insurance costs."]]]}
